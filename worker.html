<!DOCTYPE html>
<html lang="ne" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B4332">
<title>Dr.Tree — العمال</title>
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--gd:#1B4332;--gm:#2D6A4F;--gl:#52B788;--gp:#EAF5EE;--border:#DDE5E0;--muted:#64748B;--or:#D97706;--orl:#FEF3E2;--red:#C0392B;--gold:#B8860B;--goldl:#FBF3DC;--bg:#F4F7F5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari","Nirmala UI",Tahoma,sans-serif;background:var(--bg);color:#1E293B;font-size:15px}
.hdr{background:var(--gd);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.hdr b{font-size:18px}
.hdr small{display:block;opacity:.8;font-size:12px;margin-top:2px}
.hdr button{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:13px;font-family:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:16px;color:var(--gd)}
label.l{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field{margin-bottom:14px}
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;font-family:inherit;background:#fafafa;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gm);background:#fff}
textarea{min-height:70px;resize:vertical}
.err{border-color:var(--red)!important}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tasks label{display:flex;gap:8px;align-items:center;background:var(--gp);padding:10px;border-radius:10px;font-size:14px;cursor:pointer}
.tasks input{width:20px;height:20px;accent-color:var(--gm)}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;background:var(--gm);color:#fff}
.btn:disabled{opacity:.6}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1.5px solid var(--border)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:3px;inset-inline-end:3px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:13px;cursor:pointer;padding:0}
.add{width:76px;height:76px;border-radius:10px;border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:12px;cursor:pointer;background:#fff}
.add input{display:none}
.log{border-bottom:1px solid #EEF2EF;padding:12px 0}
.log:last-child{border-bottom:none}
.badge{padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.chip{background:var(--gp);color:var(--gm);padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;display:inline-block;margin:2px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:#1E293B;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;transition:.3s;z-index:100;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.muted{color:var(--muted);font-size:13px}
.uid{direction:ltr;font-family:monospace;background:var(--gp);padding:10px;border-radius:8px;word-break:break-all;font-size:14px;text-align:center;margin:10px 0;user-select:all}
.hidden{display:none!important}
.lang{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:10px;padding:8px 10px;font-size:13px;font-family:inherit;cursor:pointer;margin-inline-end:6px}
.info-btn{display:inline-block;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--gd);text-decoration:none;font-weight:700;font-size:14px}
.lang.dark{background:var(--gp);color:var(--gm);font-weight:700}
</style>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, set, remove, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const app = initializeApp({
    apiKey: "AIzaSyB60I7xq3sXZCuk2I6plb7CB_-JpHIrCXk",
    authDomain: "drtree-abfe8.firebaseapp.com",
    databaseURL: "https://drtree-abfe8-default-rtdb.asia-southeast1.firebasedatabase.app"
  });
  const db = getDatabase(app);
  const auth = getAuth(app);
  const $ = (id) => document.getElementById(id);
  const show = (id) => ['v-login','v-pending','v-app'].forEach(v => $(v).classList.toggle('hidden', v !== id));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const fmt = (d) => { if (!d) return ''; const [y,m,dd] = d.split('-'); return dd + '/' + m + '/' + y; };
  function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove('show'), 2600); }

  // ── اللغة: نيبالي (افتراضي) / عربي ──
  const I18N = {
    ne: {
      dir: 'ltr', other: 'عربي',
      loginTitle: 'कामदार लगइन', email: 'इमेल', password: 'पासवर्ड', login: 'लगइन', loggingIn: 'लगइन हुँदैछ...',
      needCreds: 'इमेल र पासवर्ड लेख्नुहोस्', badCreds: 'इमेल वा पासवर्ड गलत छ', badPass: 'पासवर्ड गलत छ', noUser: 'खाता भेटिएन',
      tooMany: 'धेरै प्रयास भयो — केही बेरपछि फेरि प्रयास गर्नुहोस्', noNet: 'इन्टरनेट छैन', loginFail: 'लगइन हुन सकेन',
      logout: 'लगआउट', notActive: 'तपाईंको खाता अझै सक्रिय छैन', sendCode: 'यो कोड म्यानेजरलाई पठाउनुहोस्, उहाँले तपाईंको खाता सक्रिय गर्नुहुनेछ:',
      copy: '📋 कपी', whatsapp: '💬 ह्वाट्सएप', autoOpen: 'खाता सक्रिय हुनेबित्तिकै यो पेज आफैं खुल्नेछ',
      newWork: '➕ नयाँ काम दर्ता गर्नुहोस्', client: 'ग्राहक', chooseClient: 'ग्राहक छान्नुहोस्...', date: 'मिति', workDone: 'तपाईंले गरेको काम',
      before: '📷 काम अघिका फोटो', after: '📷 काम पछिका फोटो', add: 'थप्नुहोस्',
      notes: 'टिप्पणी', notesPh: 'म्यानेजरलाई थाहा हुनुपर्ने कुरा...', extra: 'थप काम (भए)', extraPh: 'उदाहरण: ग्राहकको अनुरोधमा ३ वटा थप रूख रोपियो',
      send: '📤 पठाउनुहोस्', sending: 'पठाउँदैछ...', myWork: '📋 मेरो काम', noWork: 'अहिलेसम्म कुनै काम दर्ता गरिएको छैन',
      pending: '⏳ जाँच हुन बाँकी', approved: '✅ स्वीकृत', rejected: '❌ अस्वीकृत', reason: 'कारण:',
      del: '🗑 मेटाउनुहोस्', delConfirm: 'यो काम मेटाउने?', deleted: '🗑 मेटाइयो',
      copied: '✅ कपी भयो', copyManual: 'कोड छानेर आफैं कपी गर्नुहोस्', clientsFail: '⚠️ ग्राहकको नाम लोड हुन सकेन',
      preparing: '📸 फोटो तयार हुँदैछ...', needClient: '⚠️ ग्राहक र मिति छान्नुहोस्', needWork: '⚠️ गरेको काम छान्नुहोस् वा टिप्पणी लेख्नुहोस्',
      savedOffline: '📴 सेभ भयो — इन्टरनेट आएपछि पठाइनेछ', sent: '✅ म्यानेजरलाई पठाइयो', sendFail: '⚠️ पठाउन सकिएन: ',
      house: 'घर नम्बर', openMap: 'नक्सामा खोल्नुहोस्',
      tasks: { 'قص العشب': 'घाँस काट्ने', 'تشذيب': 'छाँटकाँट', 'تسميد': 'मल हाल्ने', 'فحص ري': 'सिँचाइ जाँच', 'رش مبيد': 'विषादी छर्ने', 'تنظيف': 'सरसफाइ', 'زراعة': 'बिरुवा रोप्ने', 'مكافحة آفات': 'कीरा नियन्त्रण' }
    },
    ar: {
      dir: 'rtl', other: 'नेपाली',
      loginTitle: 'دخول العمال', email: 'البريد الإلكتروني', password: 'كلمة المرور', login: 'دخول', loggingIn: 'جاري الدخول...',
      needCreds: 'أدخل البريد وكلمة المرور', badCreds: 'البريد أو كلمة المرور غلط', badPass: 'كلمة المرور غلط', noUser: 'الحساب غير موجود',
      tooMany: 'محاولات كثيرة — جرّب بعد شوي', noNet: 'ما في إنترنت', loginFail: 'تعذّر الدخول',
      logout: 'خروج', notActive: 'حسابك لسا مو مفعّل', sendCode: 'أرسل هذا الرمز للمدير عشان يفعّل حسابك:',
      copy: '📋 نسخ', whatsapp: '💬 واتساب', autoOpen: 'الصفحة بتفتح تلقائياً أول ما يتفعّل الحساب',
      newWork: '➕ تسجيل شغل جديد', client: 'العميل', chooseClient: 'اختر العميل...', date: 'التاريخ', workDone: 'الشغل اللي سويته',
      before: '📷 صور قبل', after: '📷 صور بعد', add: 'إضافة',
      notes: 'ملاحظات', notesPh: 'أي شي لازم المدير يعرفه...', extra: 'شغل إضافي (إذا في)', extraPh: 'مثال: زرعنا ٣ شجرات زيادة بطلب العميل',
      send: '📤 إرسال', sending: 'جاري الإرسال...', myWork: '📋 شغلي', noWork: 'ما سجلت شغل بعد',
      pending: '⏳ بانتظار المراجعة', approved: '✅ معتمد', rejected: '❌ مرفوض', reason: 'السبب:',
      del: '🗑 حذف', delConfirm: 'حذف هذا الشغل؟', deleted: '🗑 تم الحذف',
      copied: '✅ تم النسخ', copyManual: 'حدد الرمز وانسخه يدوياً', clientsFail: '⚠️ تعذّر تحميل أسماء العملاء',
      preparing: '📸 جاري تجهيز الصور...', needClient: '⚠️ اختر العميل والتاريخ', needWork: '⚠️ حدد الشغل اللي سويته أو اكتب ملاحظة',
      savedOffline: '📴 انحفظ — بيترسل أول ما يرجع النت', sent: '✅ تم الإرسال للمدير', sendFail: '⚠️ فشل الإرسال: ',
      house: 'رقم البيت', openMap: 'افتح الخريطة',
      tasks: {}
    }
  };
  let lang = 'ne';
  try { const s = localStorage.getItem('dt_worker_lang'); if (s === 'ar' || s === 'ne') lang = s; } catch (e) {}
  const t = (k) => (I18N[lang][k] ?? I18N.ar[k] ?? k);
  const taskLabel = (task) => (I18N[lang].tasks[task] || task);
  let lastMine = {};
  function applyLang() {
    document.documentElement.lang = lang === 'ne' ? 'ne' : 'ar';
    document.documentElement.dir = t('dir');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll('.t-cb').forEach(cb => { const sp = cb.nextElementSibling; if (sp) sp.textContent = taskLabel(cb.dataset.task); });
    document.querySelectorAll('.lang').forEach(b => b.textContent = t('other'));
    const opt0 = document.querySelector('#f-client option[value=""]'); if (opt0) opt0.textContent = t('chooseClient');
    if (me) { renderPhotos('before'); renderPhotos('after'); renderMine(lastMine); renderClientOptions(); }
  }
  window.toggleLang = () => {
    lang = lang === 'ne' ? 'ar' : 'ne';
    try { localStorage.setItem('dt_worker_lang', lang); } catch (e) {}
    applyLang();
  };

  let me = null;          // { uid, name }
  let photos = { before: [], after: [] };
  const MAX = 3;
  let unsub = [];

  // ── Login ──
  window.doLogin = async () => {
    const email = $('l-email').value.trim(), pass = $('l-pass').value;
    const err = $('l-err');
    if (!email || !pass) { err.textContent = t('needCreds'); return; }
    $('l-btn').disabled = true; $('l-btn').textContent = t('loggingIn');
    try { await signInWithEmailAndPassword(auth, email, pass); err.textContent = ''; $('l-pass').value = ''; }
    catch (e) { err.textContent = t(({'auth/invalid-credential':'badCreds','auth/invalid-login-credentials':'badCreds','auth/wrong-password':'badPass','auth/user-not-found':'noUser','auth/too-many-requests':'tooMany','auth/network-request-failed':'noNet'})[e.code] || 'loginFail'); }
    finally { $('l-btn').disabled = false; $('l-btn').textContent = t('login'); }
  };
  window.doLogout = () => { unsub.forEach(f => f()); unsub = []; signOut(auth); };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', applyLang); else applyLang();

  onAuthStateChanged(auth, async (user) => {
    unsub.forEach(f => f()); unsub = [];
    if (!user) { me = null; show('v-login'); return; }
    let snap;
    try { snap = await get(ref(db, 'workerUsers/' + user.uid)); }
    catch (e) { snap = null; }
    if (snap && snap.exists()) {
      me = { uid: user.uid, name: snap.val().name || '' };
      $('h-name').textContent = '👷 ' + me.name;
      show('v-app');
      startApp();
      applyLang();
      return;
    }
    // المدير؟ رجّعه للتطبيق الرئيسي
    try { const a = await get(ref(db, 'admins/' + user.uid)); if (a.val() === true) { location.replace('index.html'); return; } } catch (e) {}
    $('p-uid').textContent = user.uid;
    $('p-email').textContent = user.email || '';
    show('v-pending');
    // ينتظر لين المدير يربط الحساب ويفتح تلقائياً
    unsub.push(onValue(ref(db, 'workerUsers/' + user.uid), (s) => { if (s.exists()) location.reload(); }, () => {}));
  });

  window.copyUid = () => {
    const code = $('p-uid').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => toast(t('copied'))).catch(() => toast(t('copyManual')));
  };
  window.shareUid = () => {
    const msg = 'رمز حسابي في Dr.Tree:\n' + $('p-uid').textContent;
    window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
  };

  // ── App ──
  function startApp() {
    resetForm();
    unsub.push(onValue(ref(db, 'clientNames'), (s) => {
      clients = (Object.values(s.val() || {})).filter(n => typeof n === 'string').map(n => {
        const [ar, en, loc, house, phone2, phone2Label] = n.split('\t');
        return { ar, en: en || '', loc: loc || '', house: house || '', phone2: phone2 || '', phone2Label: phone2Label || '' };
      });
      renderClientOptions();
    }, () => toast(t('clientsFail'))));
    unsub.push(onValue(ref(db, 'workLogs/' + me.uid), (s) => { lastMine = s.val() || {}; renderMine(lastMine); }, () => {}));
  }

  // العميل: القيمة دايماً الاسم العربي (هذا اللي يوصل للمدير)، والظاهر للعامل بالإنجليزي إذا متوفر
  let clients = [];
  const clientLabel = (ar) => { if (lang !== 'ne') return ar; const c = clients.find(x => x.ar === ar); return (c && c.en) || ar; };
  function renderClientOptions() {
    const sel = $('f-client'), cur = sel.value;
    const list = clients.slice().sort((a, b) => clientLabel(a.ar).localeCompare(clientLabel(b.ar)));
    sel.innerHTML = '<option value="">' + esc(t('chooseClient')) + '</option>' + list.map(c => `<option value="${esc(c.ar)}">${esc(clientLabel(c.ar))}</option>`).join('');
    sel.value = cur;
    renderClientInfo();
  }

  // معلومات العميل للعامل: اللوكيشن، رقم البيت، والرقم الثاني (درايفر/عامل...)
  const ROLE_NE = { 'درايفر': 'ड्राइभर', 'سائق': 'ड्राइभर', 'عامل': 'कामदार', 'حارس': 'गार्ड', 'مسؤول البيت': 'घरको जिम्मेवार' };
  function mapsUrl(loc) { return /^https?:\/\//i.test(loc) ? loc : 'https://www.google.com/maps?q=' + encodeURIComponent(loc); }
  window.renderClientInfo = () => renderClientInfo();
  function renderClientInfo() {
    const box = $('client-info'); if (!box) return;
    const c = clients.find(x => x.ar === $('f-client').value);
    if (!c || (!c.loc && !c.house && !c.phone2)) { box.innerHTML = ''; box.classList.add('hidden'); return; }
    const role = c.phone2Label ? (lang === 'ne' ? (ROLE_NE[c.phone2Label] || c.phone2Label) : c.phone2Label) : '';
    const tel = c.phone2.replace(/[^0-9+]/g, '');
    const wa = tel.replace(/^\+/, '').replace(/^(?=[3-7]\d{7}$)/, '974');
    box.innerHTML =
      (c.house ? `<div style="margin-bottom:8px">🏠 <b>${esc(t('house'))}:</b> ${esc(c.house)}</div>` : '') +
      `<div style="display:flex;gap:8px;flex-wrap:wrap">` +
      (c.loc ? `<a class="info-btn" href="${esc(mapsUrl(c.loc))}" target="_blank" rel="noopener">📍 ${esc(t('openMap'))}</a>` : '') +
      (tel ? `<a class="info-btn" href="tel:${esc(tel)}">📞 ${esc(c.phone2)}${role ? ' (' + esc(role) + ')' : ''}</a>` +
             `<a class="info-btn" style="background:#25D366;color:#fff" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">💬</a>` : '') +
      `</div>`;
    box.classList.remove('hidden');
  }

  function resetForm() {
    $('f-client').value = '';
    renderClientInfo();
    $('f-date').value = today();
    $('f-date').max = today();
    document.querySelectorAll('.t-cb').forEach(c => c.checked = false);
    $('f-notes').value = '';
    $('f-extra').value = '';
    photos = { before: [], after: [] };
    renderPhotos('before'); renderPhotos('after');
    ['f-client','f-date'].forEach(id => $(id).classList.remove('err'));
  }

  function compress(file, maxDim = 800, q = 0.7) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = h * maxDim / w; w = maxDim; } else if (h > maxDim) { w = w * maxDim / h; h = maxDim; }
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          res(c.toDataURL('image/jpeg', q));
        };
        img.onerror = rej; img.src = e.target.result;
      };
      r.onerror = rej; r.readAsDataURL(file);
    });
  }

  function renderPhotos(side) {
    const tiles = photos[side].map((u, i) => `<div class="ph"><img src="${u}"><button type="button" onclick="delPhoto('${side}',${i})">✕</button></div>`).join('');
    const add = photos[side].length < MAX ? `<label class="add"><span style="font-size:22px">📷</span>${esc(t('add'))}<input type="file" accept="image/*" multiple onchange="addPhotos('${side}', this)"></label>` : '';
    $('ph-' + side).innerHTML = tiles + add;
  }
  window.delPhoto = (side, i) => { photos[side].splice(i, 1); renderPhotos(side); };
  window.addPhotos = async (side, input) => {
    const files = Array.from(input.files || []); input.value = '';
    const room = MAX - photos[side].length;
    if (room <= 0) return;
    toast(t('preparing'));
    for (const f of files.slice(0, room)) { try { photos[side].push(await compress(f)); } catch (e) {} }
    renderPhotos(side);
  };

  window.submitLog = async () => {
    const client = $('f-client').value, date = $('f-date').value;
    $('f-client').classList.toggle('err', !client);
    $('f-date').classList.toggle('err', !date);
    if (!client || !date) { toast(t('needClient')); return; }
    const tasks = [...document.querySelectorAll('.t-cb')].filter(c => c.checked).map(c => c.dataset.task);
    const notes = $('f-notes').value.trim(), extra = $('f-extra').value.trim();
    if (!tasks.length && !notes && !extra) { toast(t('needWork')); return; }
    const btn = $('f-btn'); btn.disabled = true; btn.textContent = t('sending');
    try {
      const r = push(ref(db, 'workLogs/' + me.uid));
      const rec = {
        id: r.key, workerUid: me.uid, workerName: me.name,
        client, date, tasks, notes, extra,
        photosBefore: photos.before.slice(), photosAfter: photos.after.slice(),
        status: 'pending', createdAt: Date.now()
      };
      const p = set(r, rec);
      if (!navigator.onLine) { toast(t('savedOffline')); resetForm(); }
      await p;
      if (navigator.onLine) toast(t('sent'));
      resetForm();
      window.scrollTo({ top: document.getElementById('mine').offsetTop - 70, behavior: 'smooth' });
    } catch (e) {
      toast(t('sendFail') + (e.code || e.message));
    } finally { btn.disabled = false; btn.textContent = t('send'); }
  };

  function renderMine(obj) {
    const rows = Object.values(obj).filter(Boolean).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 50);
    const ST = { pending: [t('pending'), '#FBF3DC', '#8B6914'], approved: [t('approved'), '#EAF5EE', '#2D6A4F'], rejected: [t('rejected'), '#FDECEA', '#C0392B'] };
    $('mine-count').textContent = rows.length ? '(' + rows.length + ')' : '';
    $('mine-list').innerHTML = rows.length ? rows.map(l => {
      const st = ST[l.status] || ST.pending;
      const n = (l.photosBefore || []).length + (l.photosAfter || []).length;
      return `<div class="log">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
          <div><b>${esc(clientLabel(l.client))}</b><div class="muted">📅 ${fmt(l.date)}${n ? ' · 📷 ' + n : ''}</div></div>
          <span class="badge" style="background:${st[1]};color:${st[2]}">${st[0]}</span>
        </div>
        ${(l.tasks || []).length ? `<div style="margin-top:6px">${l.tasks.map(x => `<span class="chip">${esc(taskLabel(x))}</span>`).join('')}</div>` : ''}
        ${l.notes ? `<div style="font-size:13px;margin-top:6px">📝 ${esc(l.notes)}</div>` : ''}
        ${l.extra ? `<div style="font-size:13px;margin-top:4px;color:var(--or)">➕ ${esc(l.extra)}</div>` : ''}
        ${l.status === 'rejected' && l.rejectReason ? `<div style="font-size:13px;margin-top:4px;color:var(--red)">${esc(t('reason'))} ${esc(lang === 'ne' && l.rejectReasonNe ? l.rejectReasonNe : l.rejectReason)}</div>` : ''}
        ${l.status === 'pending' ? `<button onclick="delLog('${esc(l.id)}')" style="margin-top:8px;background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-family:inherit;font-size:12px;color:var(--muted);cursor:pointer">${esc(t('del'))}</button>` : ''}
      </div>`;
    }).join('') : '<div class="muted" style="text-align:center;padding:16px">' + esc(t('noWork')) + '</div>';
  }
  window.delLog = (id) => {
    if (!confirm(t('delConfirm'))) return;
    remove(ref(db, 'workLogs/' + me.uid + '/' + id)).then(() => toast(t('deleted'))).catch(e => toast('⚠️ ' + (e.code || e.message)));
  };
</script>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- تسجيل الدخول -->
<div id="v-login" class="hidden" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#1B4332,#0c1f16)">
  <div class="card" style="max-width:360px;width:100%;margin:0">
    <div style="text-align:center;font-size:24px;font-weight:900;color:var(--gd)">🌳 Dr.Tree</div>
    <div class="muted" style="text-align:center;margin:4px 0 18px" data-i18n="loginTitle">دخول العمال</div>
    <div class="field"><label class="l" data-i18n="email">البريد الإلكتروني</label><input type="email" id="l-email" autocomplete="username" style="direction:ltr;text-align:left"></div>
    <div class="field"><label class="l" data-i18n="password">كلمة المرور</label><input type="password" id="l-pass" autocomplete="current-password" style="direction:ltr;text-align:left" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div id="l-err" style="color:var(--red);font-size:13px;text-align:center;min-height:18px;margin-bottom:8px"></div>
    <button class="btn" id="l-btn" onclick="doLogin()" data-i18n="login">دخول</button>
    <button class="lang dark" style="display:block;margin:14px auto 0" onclick="toggleLang()">عربي</button>
  </div>
</div>

<!-- حساب غير مفعّل -->
<div id="v-pending" class="hidden">
  <div class="hdr"><div><b>🌳 Dr.Tree</b></div><div><button class="lang" onclick="toggleLang()">عربي</button><button onclick="doLogout()" data-i18n="logout">خروج</button></div></div>
  <div class="wrap">
    <div class="card" style="text-align:center">
      <div style="font-size:40px">🔑</div>
      <h2 data-i18n="notActive">حسابك لسا مو مفعّل</h2>
      <div class="muted" data-i18n="sendCode">أرسل هذا الرمز للمدير عشان يفعّل حسابك:</div>
      <div class="uid" id="p-uid"></div>
      <div class="muted" id="p-email" style="direction:ltr"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn" style="background:var(--gm)" onclick="copyUid()" data-i18n="copy">📋 نسخ</button>
        <button class="btn" style="background:#25D366" onclick="shareUid()" data-i18n="whatsapp">💬 واتساب</button>
      </div>
      <div class="muted" style="margin-top:12px" data-i18n="autoOpen">الصفحة بتفتح تلقائياً أول ما يتفعّل الحساب</div>
    </div>
  </div>
</div>

<!-- التطبيق -->
<div id="v-app" class="hidden">
  <div class="hdr">
    <div><b>🌳 Dr.Tree</b><small id="h-name"></small></div>
    <div><button class="lang" onclick="toggleLang()">عربي</button><button onclick="doLogout()" data-i18n="logout">خروج</button></div>
  </div>
  <div class="wrap">
    <div class="card">
      <h2 data-i18n="newWork">➕ تسجيل شغل جديد</h2>
      <div class="field"><label class="l" data-i18n="client">العميل</label><select id="f-client" onchange="renderClientInfo()"><option value="">اختر العميل...</option></select>
        <div id="client-info" class="hidden" style="margin-top:8px;background:var(--gp);border-radius:10px;padding:10px;font-size:14px"></div></div>
      <div class="field"><label class="l" data-i18n="date">التاريخ</label><input type="date" id="f-date"></div>
      <div class="field">
        <label class="l" data-i18n="workDone">الشغل اللي سويته</label>
        <div class="tasks">
          <label><input type="checkbox" class="t-cb" data-task="قص العشب"><span>قص العشب</span></label>
          <label><input type="checkbox" class="t-cb" data-task="تشذيب"><span>تشذيب</span></label>
          <label><input type="checkbox" class="t-cb" data-task="تسميد"><span>تسميد</span></label>
          <label><input type="checkbox" class="t-cb" data-task="فحص ري"><span>فحص ري</span></label>
          <label><input type="checkbox" class="t-cb" data-task="رش مبيد"><span>رش مبيد</span></label>
          <label><input type="checkbox" class="t-cb" data-task="تنظيف"><span>تنظيف</span></label>
          <label><input type="checkbox" class="t-cb" data-task="زراعة"><span>زراعة</span></label>
          <label><input type="checkbox" class="t-cb" data-task="مكافحة آفات"><span>مكافحة آفات</span></label>
        </div>
      </div>
      <div class="field"><label class="l" data-i18n="before">📷 صور قبل</label><div class="photos" id="ph-before"></div></div>
      <div class="field"><label class="l" data-i18n="after">📷 صور بعد</label><div class="photos" id="ph-after"></div></div>
      <div class="field"><label class="l" data-i18n="notes">ملاحظات</label><textarea id="f-notes" data-i18n-ph="notesPh" placeholder="أي شي لازم المدير يعرفه..."></textarea></div>
      <div class="field"><label class="l" data-i18n="extra">شغل إضافي (إذا في)</label><textarea id="f-extra" data-i18n-ph="extraPh" placeholder="مثال: زرعنا ٣ شجرات زيادة بطلب العميل"></textarea></div>
      <button class="btn" id="f-btn" onclick="submitLog()" data-i18n="send">📤 إرسال</button>
    </div>

    <div class="card" id="mine">
      <h2><span data-i18n="myWork">📋 شغلي</span> <span class="muted" id="mine-count"></span></h2>
      <div id="mine-list"></div>
    </div>
  </div>
</div>
</body>
</html>
